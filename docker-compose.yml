# Local development services. Values come from the repo-root .env (see .env.example).
services:
  db:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: ${OFI_DB_USER:?set OFI_DB_USER in .env}
      POSTGRES_PASSWORD: ${OFI_DB_PASSWORD:?set OFI_DB_PASSWORD in .env}
      POSTGRES_DB: ${OFI_DB_NAME:?set OFI_DB_NAME in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
