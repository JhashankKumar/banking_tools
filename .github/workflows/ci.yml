name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (services/api)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:16.15-alpine
        # Throwaway credentials for an ephemeral CI-only database. Not secrets.
        env:
          POSTGRES_USER: ofi_ci
          POSTGRES_PASSWORD: ofi_ci_only
          POSTGRES_DB: openfraud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ofi_ci -d openfraud_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      OFI_APP_ENV: ci
      OFI_DATABASE_URL: postgresql+psycopg://ofi_ci:ofi_ci_only@localhost:5432/openfraud_test
      OFI_TEST_DATABASE_URL: postgresql+psycopg://ofi_ci:ofi_ci_only@localhost:5432/openfraud_test
      OFI_JWT_SECRET: ci-only-jwt-secret-not-for-real-use-0123456789
      OFI_DEMO_PASSWORD: ci-only-demo-password
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - name: Migrations apply cleanly and match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - run: uv run pytest

  frontend:
    name: Frontend (apps/web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
