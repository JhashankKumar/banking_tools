[project]
name = "openfraud-api"
version = "0.1.0"
description = "OpenFraud Investigator backend API (FastAPI)."
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.144.0",
    "psycopg[binary]==3.3.6",
    "pwdlib[argon2]==0.3.1",
    "pydantic-settings==2.16.0",
    "pyjwt==2.15.1",
    "python-multipart==0.0.32",
    "sqlalchemy==2.1.5",
    "uvicorn[standard]==0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "pyright==1.1.414",
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N"]

[tool.ruff.lint.per-file-ignores]
# Tests use throwaway literal credentials for synthetic users.
"tests/**" = ["S101", "S105", "S106", "S311"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["app", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
